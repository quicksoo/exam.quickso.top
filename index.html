      <section class="notice-panel" aria-labelledby="notice-title"><div class="notice-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H5v17h14V4h-3M8 3h8v4H8zM8 11h8m-8 4h6"/></svg><h2 id="notice-title">考试须知</h2><span class="notice-count" id="notice-count"></span></div><ol class="notice-list" id="notice-list"></ol><p class="notice-empty" id="notice-empty" hidden>请保持安静，认真作答。</p><div class="notice-footer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7zM8 12l3 3 5-6"/></svg>诚信应考，沉着作答</div></section>
    </div>
    <div class="below-board"><div class="sound-controls"><button id="sound-button" class="sound-button" title="点击启用结束提示音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4zM15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></svg><span id="sound-label">启用结束提示音</span></button><button class="quiet" id="test-sound">试听</button></div><span class="footnote" id="storage-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span id="storage-label">设置自动保存在本机</span></span></div>
    <footer class="site-footer"><span>exam.quickso.top</span><span id="time-source" title="时钟与倒计时以设备系统时间为准">以本机时间为准</span></footer>
  </main>
  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-head"><div><h2 id="settings-title">考试设置</h2><p>设置好本场考试，即可开始投屏。</p></div><button class="quiet icon-button" id="close-settings" type="button" aria-label="关闭考试设置" title="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><form class="settings-form" id="settings-form"><label class="field"><span class="field-label">考试名称</span><input name="title" id="input-title" maxlength="100" required placeholder="例如：期中考试 · 语文"></label><label class="field"><span class="field-label">开始时间</span><input type="datetime-local" name="start" id="input-start" step="60" required></label><label class="field"><span class="field-label">结束时间</span><input type="datetime-local" name="end" id="input-end" step="60" required><span class="field-hint">使用本机时区，支持跨天考试。</span></label><label class="field"><span class="field-label">考试须知</span><textarea name="notices" id="input-notices" maxlength="5000" placeholder="每行填写一条须知"></textarea><span class="field-hint">每行一条，会自动编号；留空则显示简短提示。</span></label><label class="check-field"><input type="checkbox" id="input-sound" name="sound">考试结束时播放提示音</label><p class="field-hint" style="margin:-8px 0 20px">结束时同时显示醒目提醒。提示音需在当前页面点击启用，建议投屏前试听并保持页面打开。</p><p class="form-error" id="form-error" role="alert" hidden></p><div class="form-actions"><button type="button" id="cancel-settings">取消</button><button class="primary" type="submit">保存设置</button></div></form></dialog>
  <dialog class="alarm-dialog" id="alarm-dialog" aria-labelledby="alarm-title"><div class="alarm-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></div><h2 id="alarm-title">考试时间到</h2><p id="alarm-description">请停止作答，有序交卷。</p><button class="primary" id="dismiss-alarm">我知道了，停止提醒</button></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p>QuickSo 考试时钟支持考试名称、起止时间、考试须知、大字时钟、全屏倒计时、结束提醒及单 HTML 离线导出。请启用 JavaScript 后设置考试并使用时钟功能。</p></noscript>
  <script type="application/json" id="exam-config">null</script>
  <script>
  (() => {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const pad = (value) => String(value).padStart(2, "0");
    const toLocalInput = (value) => {
      const date = new Date(value);
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:00`;
    };
    const defaultStart = Math.ceil(Date.now() / 300000) * 300000;
    const defaults = { title: "期中考试 · 语文", start: toLocalInput(defaultStart), end: toLocalInput(defaultStart + 7200000), notices: "请将手机等电子设备关闭，并放至指定位置。\n请在答题前准确填写姓名、班级及考号。\n考试期间保持安静，独立思考，诚信作答。\n考试结束后请停止作答，听从监考老师安排。", warningMinutes: 5, theme: "light", sound: true };
    const exported = document.documentElement.dataset.exported === "true";
    const storageKey = "quickso-exam-v1" + (exported ? `-${document.documentElement.dataset.exportId}` : "");
    let storageAvailable = true;
    const validConfig = (value) => value && typeof value.title === "string" && value.title.trim().length > 0 && value.title.length <= 100 && typeof value.start === "string" && /^\d{4}-\d\d-\d\dT\d\d:\d\d(?::\d\d)?$/.test(value.start) && typeof value.end === "string" && /^\d{4}-\d\d-\d\dT\d\d:\d\d(?::\d\d)?$/.test(value.end) && Number.isFinite(new Date(value.start).getTime()) && new Date(value.end).getTime() > new Date(value.start).getTime() && typeof value.notices === "string" && value.notices.length <= 5000 && [0, 5, 10, 15].includes(value.warningMinutes) && ["light", "dark"].includes(value.theme) && typeof value.sound === "boolean";
    const normalizeConfig = (value) => {
      if (!validConfig(value)) return null;
      const normalized = { ...value, start: `${value.start.slice(0, 16)}:00`, end: `${value.end.slice(0, 16)}:00` };
      return validConfig(normalized) ? normalized : null;
    };
    let embedded;
    try { embedded = JSON.parse($("exam-config").textContent); } catch { /* Use defaults if the embedded configuration is invalid. */ }
    let config = normalizeConfig(embedded) || defaults;
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      config = normalizeConfig(saved) || config;
    } catch { storageAvailable = false; }
    let previousPhase;
    let alarmFired = false;
    let audioContext;
    let audioReady = false;
    let audioNodes = [];
    let toastTimeout;
    const dateFormat = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
    const shortDateFormat = new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric" });
    const clockFormat = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    const timeText = (date) => `${pad(date.getHours())}:${pad(date.getMinutes())}${date.getSeconds() ? `:${pad(date.getSeconds())}` : ""}`;
    const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    const durationText = (milliseconds) => {
      const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
      return `${pad(Math.floor(seconds / 3600))}:${pad(Math.floor(seconds / 60) % 60)}:${pad(seconds % 60)}`;
    };
    function toast(message) {
      clearTimeout(toastTimeout);
      $("toast").textContent = message;
      $("toast").hidden = false;
      toastTimeout = setTimeout(() => { $("toast").hidden = true; }, 4500);
    }
    function persist() {
      try { localStorage.setItem(storageKey, JSON.stringify(config)); storageAvailable = true; }
      catch { storageAvailable = false; }
      $("storage-label").textContent = storageAvailable ? "设置已保存在本机" : "本机存储不可用，请导出离线版保存设置";
    }
    function updateSoundLabel() {
      const ready = config.sound && audioReady && audioContext?.state === "running";
      $("sound-label").textContent = !config.sound ? "结束提示音已关闭" : ready ? "结束提示音已启用" : "启用结束提示音";
      $("sound-button").classList.toggle("enabled", !!ready);
      $("sound-button").setAttribute("aria-pressed", String(!!ready));
      $("sound-button").title = ready ? "点击关闭结束提示音" : "点击启用结束提示音";
    }
    async function unlockAudio() {
      try {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) throw new Error("Audio unavailable");
        if (!audioContext || audioContext.state === "closed") {
          audioContext = new Audio();
          audioContext.addEventListener("statechange", updateSoundLabel);
        }
        await audioContext.resume();
        audioReady = audioContext.state === "running";
        updateSoundLabel();
        if (!audioReady) throw new Error("Audio suspended");
        return true;
      } catch {
        audioReady = false;
        updateSoundLabel();
        toast("当前浏览器无法启用声音，考试结束时仍会显示提醒。");
        return false;
      }
    }
    function stopSound() {
      audioNodes.forEach((node) => { try { node.stop(); } catch { /* Already ended. */ } });
      audioNodes = [];
    }
    function playSound(rounds = 1) {
      stopSound();
      if (!audioReady || audioContext?.state !== "running") return;
      const start = audioContext.currentTime + .03;
      for (let round = 0; round < rounds; round++) {
        [660, 880, 660].forEach((frequency, index) => {
          const at = start + round * 2 + index * .32;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0, at);
          gain.gain.linearRampToValueAtTime(.22, at + .025);
          gain.gain.exponentialRampToValueAtTime(.001, at + .26);
          oscillator.connect(gain); gain.connect(audioContext.destination);
          oscillator.start(at); oscillator.stop(at + .28);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); audioNodes = audioNodes.filter((node) => node !== oscillator); };
          audioNodes.push(oscillator);
        });
      }
    }
    function notifyEnd() {
      alarmFired = true;
      if ($("settings-dialog").open) $("settings-dialog").close();
      $("alarm-description").textContent = `${config.title}已结束，请停止作答，有序交卷。`;
      if (!$("alarm-dialog").open) $("alarm-dialog").showModal();
      if (config.sound) playSound(4);
    }
    function tick() {
      const now = new Date();
      const start = new Date(config.start).getTime();
      const end = new Date(config.end).getTime();
      const current = now.getTime();
      const phase = current < start ? "waiting" : current < end ? "active" : "ended";
      const remaining = phase === "waiting" ? start - current : Math.max(0, end - current);
      $("clock").textContent = clockFormat.format(now);
      const dateParts = dateFormat.formatToParts(now);
      $("clock-calendar").textContent = dateParts.filter((part) => part.type !== "weekday").map((part) => part.value).join("").trim();
      $("clock-weekday").textContent = dateParts.find((part) => part.type === "weekday").value;
      $("countdown").textContent = durationText(remaining);
      $("countdown-label").textContent = phase === "waiting" ? "距考试开始" : phase === "active" ? "距考试结束" : "考试已结束";
      $("phase-label").textContent = phase === "waiting" ? "等待开考" : phase === "active" ? "考试进行中" : "考试已结束";
      document.body.dataset.phase = phase;
      document.body.dataset.warning = String(phase === "active" && config.warningMinutes > 0 && remaining <= config.warningMinutes * 60000);
      const progress = Math.min(100, Math.max(0, (current - start) / (end - start) * 100));
      $("progress-fill").style.height = `${progress}%`;
      $("progress-marker").style.top = `${progress}%`;
      $("progress").setAttribute("aria-valuenow", String(Math.round(progress)));
      $("progress").setAttribute("aria-valuetext", `考试已完成 ${Math.round(progress)}%`);
      if (previousPhase && previousPhase !== "ended" && phase === "ended" && !alarmFired) notifyEnd();
      previousPhase = phase;
    }
    function renderProgressTicks(duration) {
      const halfMinutes = Number((duration / 120000).toFixed(2));
      const ticks = new Map([[duration / 2, String(halfMinutes)]]);
      for (const minutes of [30, 10]) {
        const remaining = minutes * 60000;
        if (remaining < duration && !ticks.has(remaining)) ticks.set(remaining, String(minutes));
      }
      $("progress-ticks").replaceChildren();
      [...ticks].sort(([a], [b]) => b - a).forEach(([remaining, label]) => {
        const tick = document.createElement("div");
        tick.className = "progress-tick";
        tick.style.top = `${(1 - remaining / duration) * 100}%`;
        const text = document.createElement("span");
        text.textContent = label;
        tick.append(text);
        $("progress-ticks").append(tick);
      });
    }
    function renderConfig() {
      const start = new Date(config.start);
      const end = new Date(config.end);
      document.title = exported || location.protocol === "file:" ? `${config.title} · QuickSo 考试时钟` : "考试倒计时与考场时钟 - 全屏考试时钟、离线导出 | QuickSo";
      document.documentElement.dataset.theme = config.theme;
      $("exam-title").textContent = config.title;
      const dateParts = dateFormat.formatToParts(start);
      $("exam-calendar").textContent = dateParts.filter((part) => part.type !== "weekday").map((part) => part.value).join("").trim();
      $("exam-weekday").textContent = dateParts.find((part) => part.type === "weekday").value;
      $("exam-schedule").textContent = `${timeText(start)} — ${sameDay(start, end) ? "" : `${shortDateFormat.format(end)} `}${timeText(end)}`;
      const minutes = Math.round((end - start) / 60000 * 100) / 100;
      $("exam-duration").textContent = `共 ${minutes} 分钟`;
      renderProgressTicks(end - start);
      $("start-time").textContent = timeText(start);
      $("end-time").textContent = `${sameDay(start, end) ? "" : `${shortDateFormat.format(end)} `}${timeText(end)}`;
      $("notice-list").replaceChildren();
      const notices = config.notices.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      notices.forEach((text) => { const li = document.createElement("li"); li.textContent = text; $("notice-list").append(li); });
      $("notice-count").textContent = notices.length ? `${pad(notices.length)} 条` : "";
      $("notice-empty").hidden = notices.length > 0;
      $("notice-list").hidden = notices.length === 0;
      updateSoundLabel();
      tick();
    }
    function openSettings() {
      $("input-title").value = config.title;
      $("input-start").value = config.start.slice(0, 16);
      $("input-end").value = config.end.slice(0, 16);
      $("input-notices").value = config.notices;
      $("input-sound").checked = config.sound;
      $("form-error").hidden = true;
      $("settings-dialog").showModal();
    }
    $("settings-button").addEventListener("click", openSettings);
    for (const id of ["close-settings", "cancel-settings"]) $(id).addEventListener("click", () => $("settings-dialog").close());
    $("settings-dialog").addEventListener("click", (event) => {
      if (event.target !== $("settings-dialog")) return;
      const bounds = $("settings-dialog").getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) $("settings-dialog").close();
    });
    $("settings-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const next = normalizeConfig({ title: $("input-title").value.trim(), start: $("input-start").value, end: $("input-end").value, notices: $("input-notices").value, warningMinutes: config.warningMinutes, theme: config.theme, sound: $("input-sound").checked });
      if (!next) {
        $("form-error").textContent = !$("input-title").value.trim() ? "请填写考试名称。" : "请检查时间：结束时间必须晚于开始时间。";
        $("form-error").hidden = false;
        return;
      }
      const timeChanged = next.start !== config.start || next.end !== config.end;
      config = next;
      if (timeChanged) { previousPhase = undefined; alarmFired = false; stopSound(); }
      persist(); renderConfig();
      $("settings-dialog").close();
      if (config.sound) void unlockAudio();
      toast(storageAvailable ? "考试设置已保存" : "设置已应用，请导出离线版保存");
    });
    $("sound-button").addEventListener("click", async () => {
      if (config.sound && audioReady && audioContext?.state === "running") { config.sound = false; stopSound(); }
      else { config.sound = true; await unlockAudio(); }
      persist(); updateSoundLabel();
    });
    $("test-sound").addEventListener("click", async () => {
      if (await unlockAudio()) { playSound(); toast("正在试听；结束提示音为四组提示铃声。"); }
    });
    $("dismiss-alarm").addEventListener("click", () => $("alarm-dialog").close());
    $("alarm-dialog").addEventListener("close", stopSound);
    $("alarm-dialog").addEventListener("cancel", stopSound);
    function fullscreenChanged() {
      const active = !!document.fullscreenElement;
      const label = active ? "退出全屏" : "全屏显示";
      $("fullscreen-label").textContent = label;
      $("fullscreen-button").title = label;
      $("fullscreen-button").setAttribute("aria-label", label);
      $("fullscreen-button").setAttribute("aria-pressed", String(active));
    }
    $("fullscreen-button").addEventListener("click", async () => {
      if (config.sound) void unlockAudio();
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        else toast("当前浏览器不支持一键全屏，可尝试浏览器的全屏功能。");
      } catch { toast("未能进入全屏，请使用浏览器全屏功能，或在独立窗口打开。"); }
    });
    document.addEventListener("fullscreenchange", fullscreenChanged);
    function exportHtml() {
      const clone = document.documentElement.cloneNode(true);
      clone.dataset.exported = "true";
      clone.dataset.exportId = `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
      delete clone.dataset.embed;
      clone.querySelector("#exam-config").textContent = JSON.stringify(config).replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
      clone.querySelectorAll("dialog").forEach((dialog) => dialog.removeAttribute("open"));
      clone.querySelector("#toast").hidden = true;
      clone.querySelector("#form-error").hidden = true;
      clone.querySelector("#edition").textContent = "离线版";
      clone.querySelector('meta[name="robots"]').setAttribute("content", "noindex,nofollow");
      clone.querySelector("#fullscreen-label").textContent = "全屏显示";
      clone.querySelector("#sound-label").textContent = config.sound ? "启用结束提示音" : "结束提示音已关闭";
      const blob = new Blob(["<!doctype html>\n" + clone.outerHTML], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `${config.title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_").replace(/[. ]+$/g, "").slice(0, 70) || "考试时钟"}-离线版.html`;
      document.body.append(anchor); anchor.click(); anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast("离线版已导出，双击 HTML 即可使用。打开后请启用提示音。");
    }
    $("export-button").addEventListener("click", exportHtml);
    const embed = new URLSearchParams(location.search).get("embed") === "1";
    document.documentElement.dataset.embed = String(embed);
    $("edition").textContent = exported || location.protocol === "file:" ? "离线版" : "在线版";
    $("storage-label").textContent = storageAvailable ? exported ? "离线可用 · 设置保存在本机" : "设置自动保存在本机" : "本机存储不可用，请导出离线版保存设置";
    renderConfig(); fullscreenChanged();
    setInterval(tick, 250);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); updateSoundLabel(); } });
    window.addEventListener("pageshow", tick);
  })();
  </script>
